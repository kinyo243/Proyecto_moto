version: '3.8'

services:
  # Servidor Gateway RTSP -> WebRTC / HLS (MediaMTX)
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: taller_mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP ingress / egress
      - "8888:8888"   # HLS egress (fallback)
      - "8889:8889"   # WebRTC WHEP/WHIP (Ultra Low Latency <500ms)
    environment:
      - MTX_PROTOCOLS=tcp
      - MTX_WEBRTCADDITIONALHOSTS=localhost
      # Configuración dinámica para leer cámaras registradas en la API
      # MediaMTX puede solicitar la URL RTSP bajo demanda mediante 'runOnDemand' o leerlas desde archivo

